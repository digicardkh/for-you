<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>I have a question for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Outfit:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;700&family=Noto+Serif+Khmer:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFD9DF;--coral:#FF5C7A;--butter:#FFE27A;--plum:#2D1230;--mint:#BFF0DC;--cream:#FFF6E5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--plum);font-family:'Outfit','Noto Sans Khmer',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden;position:relative}
button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}
:focus-visible{outline:4px solid var(--plum);outline-offset:3px}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.deco svg{position:absolute;width:var(--s);fill:var(--c);stroke:var(--plum);stroke-width:1.4;stroke-linejoin:round;animation:float 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-14px) rotate(calc(var(--r) + 5deg))}}
.wrap{position:relative;width:min(100%,560px);text-align:center}
.card{background:var(--cream);border:4px solid var(--plum);border-radius:28px;box-shadow:8px 8px 0 var(--plum);padding:36px 28px 32px}
h1,h2{font-family:'Caprasimo','Noto Serif Khmer',serif;font-weight:400;line-height:1.08;margin:0}
h1{font-size:clamp(2.2rem,8vw,3.4rem)}
h2{font-size:clamp(1.9rem,7vw,2.8rem)}
.hey{font-weight:700;font-size:1.1rem;margin:0 0 10px}
.sub{font-size:1.1rem;line-height:1.5;margin:16px auto 28px;max-width:36ch}
.btns{display:flex;gap:22px 28px;justify-content:center;align-items:center;flex-wrap:wrap}
.btn{border:4px solid var(--plum);border-radius:999px;font-weight:700;font-size:1.2rem;padding:.8rem 2rem;min-height:56px;box-shadow:4px 4px 0 var(--plum);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--plum)}
.yes{background:var(--coral);color:#fff;font-size:calc(1.2rem * var(--grow,1));padding:calc(.8rem * var(--grow,1)) calc(2rem * var(--grow,1));text-shadow:0 1px 0 rgba(45,18,48,.35)}
.no{background:#fff}
.no.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px) rotate(-3deg)}75%{transform:translateX(8px) rotate(3deg)}}
.env{background:none;border:0;padding:0;display:block;margin:0 auto;width:min(340px,86vw)}
.env svg{width:100%;height:auto;display:block;overflow:visible;filter:drop-shadow(8px 8px 0 var(--plum))}
.env:hover .flap{transform:rotateX(18deg)}
.flap{transform-origin:130px 50px;transition:transform .3s}
.env-label{font-family:'Caprasimo',serif;font-size:1.5rem;margin-top:22px}
.env-sub{margin:6px 0 0;font-size:1rem}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
[hidden]{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 22px}
.chip{border:3px solid var(--plum);background:#fff;border-radius:999px;padding:.55rem 1.1rem;font-weight:500;min-height:46px}
.chip[aria-pressed="true"]{background:var(--butter);box-shadow:3px 3px 0 var(--plum);font-weight:700}
.q{font-weight:700;margin:18px 0 0}
.reply{width:100%;border:3px solid var(--plum);border-radius:16px;background:#fff;font:inherit;font-size:1.05rem;padding:14px;resize:none;color:var(--plum);margin:6px 0 16px}
.link{display:inline-block;margin-top:16px;font-weight:700;color:var(--plum)}
.again{background:none;border:0;text-decoration:underline;font-weight:500;margin-top:18px;font-size:1rem}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){.deco svg,.pop,.no.shake{animation:none}.flap,.btn{transition:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="deco" id="deco" aria-hidden="true"></div>

<main class="wrap">
  <section id="s-env" aria-label="A message for you">
    <button class="env" id="open" type="button" aria-label="Open the envelope">
      <svg viewBox="0 0 260 200" aria-hidden="true">
        <rect x="10" y="50" width="240" height="140" rx="12" fill="#FFF6E5" stroke="#2D1230" stroke-width="5" stroke-linejoin="round"/>
        <path d="M14 58 L130 140 L246 58" fill="none" stroke="#2D1230" stroke-width="5" stroke-linejoin="round"/>
        <g class="flap"><path d="M10 56 L130 138 L250 56 Q250 50 244 50 L16 50 Q10 50 10 56Z" fill="#FF5C7A" stroke="#2D1230" stroke-width="5" stroke-linejoin="round"/></g>
        <path d="M130 156s-22-14.5-22-30a12 12 0 0 1 22-6.6A12 12 0 0 1 152 126c0 15.500-22 30-22 30z" fill="#FFE27A" stroke="#2D1230" stroke-width="5" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="env-label">You got something</div>
    <p class="env-sub">Tap the envelope to open it.</p>
  </section>

  <section class="card pop" id="s-ask" hidden aria-labelledby="ask">
    <p class="hey" id="hey"></p>
    <h1 id="ask"></h1>
    <p class="sub" id="sub"></p>
    <div class="btns">
      <button class="btn yes" id="yes" type="button">Yes</button>
      <button class="btn no" id="no" type="button">No</button>
    </div>
  </section>

  <section class="card pop" id="s-yes" hidden aria-labelledby="yesH">
    <h2 id="yesH">Yay! It’s a date.</h2>
    <p class="sub" style="margin-bottom:6px">Help me plan it. Pick what sounds good.</p>
    <p class="q">What should we do?</p>
    <div class="chips" id="what" role="group" aria-label="What to do"></div>
    <p class="q" style="margin-top:0">When?</p>
    <div class="chips" id="when" role="group" aria-label="When"></div>
    <label class="q" for="reply" style="display:block;margin:0">Your reply</label>
    <textarea class="reply" id="reply" rows="3" readonly></textarea>
    <button class="btn yes" id="copy" type="button" style="--grow:1">Copy my reply</button>
    <p id="copied" role="status" style="min-height:1.5em;margin:12px 0 0"></p>
    <a class="link" id="contact" href="#" hidden target="_blank" rel="noopener">Send it to me</a>
  </section>

  <section class="card pop" id="s-no" hidden aria-labelledby="noH">
    <h2 id="noH">That’s okay!</h2>
    <p class="sub">Thank you for being honest with me. I really respect that, and I’d still love to stay friends.</p>
    <button class="btn" id="back" type="button" style="background:var(--mint)">Friends</button>
    <div><button class="again" id="change" type="button">Wait, I changed my mind</button></div>
  </section>
</main>

<script>
/* ======= Edit these ======= */
const NAME = "";                 // her/his name, e.g. "Sophea". Leave empty for "Hey you,"
const ASK  = "Will you go on a date with me?";
const SUB  = "I’ve been wanting to ask you for a while. No pressure, I just think you’re really cool.";
const CONTACT = "";              // optional link to message you, e.g. "https://t.me/yourname"
const WHAT = ["Coffee", "A movie", "Dinner", "A walk"];
const WHEN = ["This weekend", "Next week", "Whenever you’re free"];
/* ========================== */
const $ = s => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('#hey').textContent = 'Hey ' + (NAME || 'you') + ',';
$('#ask').textContent = ASK; $('#sub').textContent = SUB;
document.title = 'A question for ' + (NAME || 'you');

// background hearts
const HEART = '<path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z"/>';
[['6%','12%',54,'#FF5C7A',-10,0],['82%','8%',40,'#FFE27A',12,1.2],['90%','58%',60,'#BFF0DC',8,2.1],['4%','66%',46,'#FFE27A',-6,.6],['70%','86%',44,'#FF5C7A',10,1.8],['22%','90%',36,'#BFF0DC',-12,2.6]].forEach(([l,t,s,c,r,d]) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg','svg'); e.setAttribute('viewBox','0 0 24 24');
  e.style.cssText = `left:${l};top:${t};--s:${s}px;--c:${c};--r:${r}deg;--d:${d}s`; e.innerHTML = HEART; $('#deco').append(e);
});

const show = id => { ['s-env','s-ask','s-yes','s-no'].forEach(x => $('#'+x).hidden = x !== id); };
$('#open').addEventListener('click', () => { show('s-ask'); $('#yes').focus({preventScroll:true}); });

// yes / no
let noCount = 0;
const NOTXT = ['Are you sure?', 'Really sure?', 'Last chance…'];
$('#no').addEventListener('click', () => {
  noCount++;
  if (noCount <= NOTXT.length) {
    $('#no').textContent = NOTXT[noCount - 1];
    $('#yes').style.setProperty('--grow', 1 + noCount * .16);
    const n = $('#no'); n.classList.remove('shake'); void n.offsetWidth; n.classList.add('shake');
  } else { show('s-no'); }
});
$('#back').addEventListener('click', () => { $('#back').textContent = 'Thanks for understanding'; $('#back').disabled = true; });
$('#change').addEventListener('click', () => { noCount = 0; $('#no').textContent = 'No'; $('#yes').style.setProperty('--grow', 1); $('#back').textContent = 'Friends'; $('#back').disabled = false; show('s-ask'); });
$('#yes').addEventListener('click', () => { show('s-yes'); hearts(); updateReply(); $('#yesH').scrollIntoView({block:'center', behavior: reduceMotion ? 'auto' : 'smooth'}); });

// planner
let what = WHAT[0], when = WHEN[0];
function chips(id, list, set) {
  list.forEach((t, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = t; b.setAttribute('aria-pressed', i === 0);
    b.addEventListener('click', () => { $('#'+id).querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b)); set(t); updateReply(); });
    $('#'+id).append(b);
  });
}
chips('what', WHAT, t => what = t); chips('when', WHEN, t => when = t);
function updateReply() {
  const w = what.toLowerCase().replace(/^a /, 'a ');
  $('#reply').value = 'Yes, I’d love to! Let’s do ' + w + ' ' + when.toLowerCase() + '.';
  if (CONTACT) { const a = $('#contact'); a.hidden = false; a.href = CONTACT; }
}
$('#copy').addEventListener('click', async () => {
  const ta = $('#reply'); let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {
    try { ta.removeAttribute('readonly'); ta.select(); ok = document.execCommand('copy'); ta.setAttribute('readonly', ''); } catch (e2) {}
  }
  $('#copied').textContent = ok ? 'Copied! Now send it to me.' : 'Press and hold the text above to copy it, then send it to me.';
});

// heart burst
function hearts() {
  if (reduceMotion) return;
  const cv = $('#fx'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#FF5C7A', '#FFE27A', '#BFF0DC', '#FFFFFF', '#FF8FA5'];
  const ps = Array.from({ length: 110 }, () => ({ x: W / 2, y: H * .55, vx: (Math.random() - .5) * 16, vy: -6 - Math.random() * 12, s: 8 + Math.random() * 14, r: Math.random() * 6, vr: (Math.random() - .5) * .2, c: cols[(Math.random() * cols.length) | 0] }));
  const path = new Path2D('M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z');
  let t = 0;
  (function f() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); const k = p.s / 24; ctx.scale(k, k); ctx.translate(-12, -12);
      ctx.fillStyle = p.c; ctx.strokeStyle = '#2D1230'; ctx.lineWidth = 1.4 / k; ctx.fill(path); ctx.stroke(path); ctx.restore(); });
    if (++t < 200) requestAnimationFrame(f); else ctx.clearRect(0, 0, W, H);
  })();
}
</script>
</body>
</html>
